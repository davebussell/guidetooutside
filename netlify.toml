[build]
  command = "npm run build"
  publish = ".next"

# Build settings for a build on Netlify's own servers (from the GitHub repo), matching the local builds: the site's
# address is public. No AdSense id is set: the site launched without ads (decision of 14 November 2026); set
# NEXT_PUBLIC_ADSENSE_CLIENT and NEXT_PUBLIC_GA_ID in the Netlify project when they are wanted.
[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE_URL = "https://guidetooutside.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The site has one address.
[[redirects]]
  from = "https://guidetooutside.netlify.app/*"
  to = "https://guidetooutside.com/:splat"
  status = 301
  force = true

# Shared spaces closed in October 2026: old links go to the conservation hub.
[[redirects]]
  from = "/spaces"
  to = "/conservation"
  status = 301
  force = true

[[redirects]]
  from = "/spaces/*"
  to = "/conservation"
  status = 301
  force = true

# The Netlify Image CDN may fetch (and resize to 640 x 400 webp) the images in the conservation
# organisations' own feeds, from these hosts only: one exact-host pattern each, generated by
# scripts/fetch-org-news.ts on 26 October 2026 and mirrored in src/lib/conservation/news-hosts.ts.
